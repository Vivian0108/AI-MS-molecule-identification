name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: make verify
        env:
          UNKNOWNID_MODE: demo
      - run: .venv/bin/python scripts/rehearse_demo.py
        env:
          UNKNOWNID_MODE: demo
