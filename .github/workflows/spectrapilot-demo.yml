name: SpectraPilot demo
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            lock: requirements-demo-py311.lock
          - python: '3.12'
            lock: requirements-demo.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - run: make demo-verify PY=python
      - run: python -m compileall -q src app
      - run: python -m pip install ruff==0.17.1
      - run: ruff check --select E4,E7,E9,F src/spectrapilot/demo.py src/spectrapilot/demo_api.py src/spectrapilot/service.py src/spectrapilot/planning/session.py app/spectrapilot_demo.py scripts/build_spectrapilot_demo.py tests/test_spectrapilot_demo.py
      - run: ruff format --check src/spectrapilot/demo.py src/spectrapilot/demo_api.py src/spectrapilot/service.py src/spectrapilot/planning/session.py app/spectrapilot_demo.py scripts/build_spectrapilot_demo.py tests/test_spectrapilot_demo.py
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.lock
      - run: python -m pip install --require-hashes -r requirements-research.lock
      - run: make verify PY=python
